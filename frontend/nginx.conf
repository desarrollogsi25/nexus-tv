server {
    listen 8080;

    # Deshabilitar cache de assets para asegurar versiones actualizadas
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy a API
    location /api/ {
        proxy_pass http://backend:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy para Socket.io (WebSockets)
    location /socket.io/ {
        proxy_pass http://backend:3002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Proxy a Media local — SIN cache para que el fallback SVG funcione correctamente
    location /media/ {
        proxy_pass http://backend:3002/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Eliminar headers de cache del backend para evitar 304
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Cache-Control;

        # Forzar no-cache en el navegador
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;

        # No enviar If-None-Match/If-Modified-Since al backend
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
    }
}
